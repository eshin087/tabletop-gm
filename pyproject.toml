[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabletop-gm"
version = "0.1.0"
description = "Builds a tailored cybersecurity tabletop exercise from an industry pack, the organization's exposure data, and its own written plans."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "gcd"}]
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
tenable = ["pytenable>=1.4"]
dev = ["pytest>=8.0"]

[project.scripts]
ttx = "ttx.cli:main"

[tool.setuptools]
packages = ["ttx", "ttx.build"]
include-package-data = true

[tool.setuptools.package-data]
ttx = ["templates/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
