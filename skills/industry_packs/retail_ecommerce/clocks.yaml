# Clocks for the retail_ecommerce pack. This file is the only place deadlines live.
# clock_engine reads it; the validator fails the build on any clock without
# source_url, verified_date, tier, and deadline_text.
#
# tier:
#   verified    a human opened source_url on verified_date and confirmed the deadline. Used silently.
#   researched  drafted by the pack_research skill from an authoritative source, not yet human-checked.
#               Every output that uses it carries a "verify before exercise" banner.
#
# applies_when: all listed keys must hold (AND). List-valued keys hold when any value matches (OR).
#   industries        pack slugs; omit for any industry (used by clocks_common.yaml)
#   data_types        PHI, PII, PCI, PFI, FERPA, CUI, OT, trade_secrets
#   countries         ISO 3166-1 alpha-2
#   states            US state codes
#   public_company    true or false
#   flags             intake.regulated flags that must all be present, for example nydfs_licensed
#   min_affected      the clock applies only when intake.affected_estimate is at least this number
#
# US state breach laws, SEC Form 8-K, GDPR, and CIRCIA are not repeated here; they come from
# clocks_common.yaml (includes_common: true). Mastercard ADC timing is pack.md guidance only
# because the source documents could not be opened during research. The Visa three-day
# Compromise Event notice lives in clocks_common.yaml (pci_visa_compromise_notice_3_days) so
# every PCI merchant gets it once.

pack: retail_ecommerce
display_name: Retail and e-commerce
includes_common: true

clocks:
  - id: retail_visa_incident_report
    name: Visa, initial Incident Report after notification
    regulator: Visa Global Risk Investigations and the acquiring bank
    jurisdiction: Visa network rules (global)
    trigger: notification to Visa under Section A-1 (the pci_visa_compromise_notice_3_days clock in clocks_common.yaml)
    deadline_hours: 72
    deadline_business_days: null
    deadline_text: "within three (3) calendar days of notifying Visa in accordance with Section A-1, provide a report describing the event (the Incident Report) to Visa and the Acquiring bank (if applicable)"
    applies_when:
      industries: [retail_ecommerce]
      data_types: [PCI]
    source_url: https://usa.visa.com/dam/VCOM/download/merchants/cisp-what-to-do-if-compromised.pdf
    citation: "Visa, What To Do If Compromised, Visa Supplemental Requirements, Version 10.0, effective 25 June 2026, Section A-2.1 and Attachment A"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "Chains from the notification clock, so the outer bound is six calendar days from discovery. If Visa requires a PCI Forensic Investigator, the contract must be executed within five business days and the preliminary forensic report delivered within five business days of that (Sections B-4.3.1 and B-4.3.2)."

  - id: retail_ftc_safeguards_notice
    name: FTC Safeguards Rule, notification event notice to the FTC
    regulator: Federal Trade Commission
    jurisdiction: US-federal
    trigger: discovery of a notification event (treated as discovered on the first day the event is known to any employee, officer, or agent other than the person who committed the breach)
    deadline_hours: 720
    deadline_business_days: null
    deadline_text: "if the notification event involves the information of at least 500 consumers, notify the Federal Trade Commission as soon as possible, and no later than 30 days after discovery of the event"
    applies_when:
      industries: [retail_ecommerce]
      countries: [US]
      data_types: [PFI]
      flags: [nonbank_financial_institution]
      min_affected: 500
    source_url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-C/part-314/section-314.4
    citation: "16 CFR 314.4(j)(1) and (j)(2)"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "text confirmed via the eCFR renderer API and the law.cornell.edu mirror on 2026-11-03; www.ecfr.gov redirects automated fetches. Applies to retailers that are non-bank financial institutions under the Safeguards Rule, for example those that issue store credit or finance purchases. The notice is filed electronically on the FTC's form and must state whether law enforcement has asked in writing that public notice be delayed."

exercise_requirements:
  - id: retail_pci_dss_12_10_2_annual_test
    name: PCI DSS v4.0.1 Requirement 12.10.2, annual incident response plan review and test
    requirement: "At least once every 12 months, the security incident response plan is reviewed and the content is updated as needed, and tested, including all elements listed in Requirement 12.10.1"
    frequency: annual
    source_url: https://www.pcisecuritystandards.org/document_library/
    citation: "PCI DSS v4.0.1, Requirement 12.10.2 (12.10.1 requires an incident response plan that exists and is ready to be activated; 12.10 requires the plan to cover legal reporting analysis and payment brand procedures)"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "The document library page lists PCI DSS v4.0.1 but the standard sits behind a license acceptance. The 12.10.2 wording above was confirmed in the PCI DSS v4.0 SAQ D for Merchants at https://listings.pcisecuritystandards.org/documents/PCI-DSS-v4-0-SAQ-D-Merchant.pdf on 2026-11-03; confirm the v4.0.1 text is unchanged before citing it in a deliverable."
