# Clocks shared by many packs. Any pack with includes_common: true loads this file. This file is the
# only place these deadlines live; the validator fails the build on any clock without source_url,
# verified_date, tier, and deadline_text.
#
# tier:
#   verified    a human opened source_url on verified_date and confirmed the deadline. Used silently.
#   researched  drafted by the pack_research skill from an authoritative source, not yet human-checked.
#               Every output that uses it carries a "verify before exercise" banner.
#
# applies_when: all listed keys must hold (AND). List-valued keys hold when any value matches (OR).
#   industries        omitted here: these clocks apply to any industry
#   data_types        PHI, PII, PCI, PFI, FERPA, CUI, OT, trade_secrets, biometric, SSN
#   countries         ISO 3166-1 alpha-2
#   states            US state codes
#   public_company    true or false
#   flags             intake.regulated flags that must all be present
#   min_affected      the clock applies only when intake.affected_estimate is at least this number
#                     ("more than 500" is recorded as 501; "500 or more" as 500)
#
# To promote a clock after checking the source: set tier: verified, verifier: <your name>,
# verified_date: <date you checked>.

pack: common
display_name: Clocks shared by many packs
notes: "Drafted by the pack_research skill on 2026-11-03 from primary sources. Coverage: GDPR, UK GDPR, SEC Form 8-K Item 1.05, CIRCIA, Visa card brand compromise rules, and US state breach laws for the 20 most populous states plus every other state whose statute sets a day count that could be confirmed on the legislature or attorney general site (Alabama, Colorado, Connecticut, Delaware, Louisiana, Maine, New Mexico, Oklahoma, Oregon, Rhode Island, South Dakota, Vermont). Not confirmed on an official site and marked in their notes: Georgia (code hosted only on a commercial platform), Tennessee (public chapter PDF returned 403; legislature bill page used), Indiana (legislature site did not render; attorney general FAQ used). Mastercard account data compromise rules were not fetched; the PCI clock rests on the Visa document only. Several state sites block automated fetching: those marked 'opened in the desktop browser pane' were read through the Claude desktop browser rather than WebFetch. Every state clock here is for notice to individuals holding personal information (data_types PII); regulator and attorney general clocks are listed separately where the statute sets its own timing or threshold. Day counts are converted to calendar hours (days times 24)."

clocks:
  - id: gdpr_art33_supervisory_authority
    name: GDPR Article 33, notification of a personal data breach to the supervisory authority
    regulator: Competent EU supervisory authority (Article 55)
    jurisdiction: EU
    trigger: the controller becomes aware of a personal data breach that is not unlikely to result in a risk to the rights and freedoms of natural persons
    deadline_hours: 72
    deadline_business_days: null
    deadline_text: "the controller shall without undue delay and, where feasible, not later than 72 hours after having become aware of it, notify the personal data breach to the supervisory authority competent in accordance with Article 55, unless the personal data breach is unlikely to result in a risk to the rights and freedoms of natural persons. Where the notification to the supervisory authority is not made within 72 hours, it shall be accompanied by reasons for the delay"
    applies_when:
      flags: [eu_data_subjects]
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679
    citation: "Regulation (EU) 2016/679, Article 33(1)"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "Opened in the desktop browser pane on 2026-11-03 (WebFetch returned an empty body for every eur-lex URL tried). Article 33(2) requires the processor to notify the controller without undue delay. Article 33(4) allows information to be provided in phases. Awareness, not detection, starts the clock; recital 85 says the controller should notify as soon as it becomes aware."

  - id: gdpr_art34_data_subjects
    name: GDPR Article 34, communication of a personal data breach to the data subject
    regulator: Competent EU supervisory authority (enforcement)
    jurisdiction: EU
    trigger: the personal data breach is likely to result in a high risk to the rights and freedoms of natural persons
    deadline_hours: null
    deadline_business_days: null
    deadline_text: "When the personal data breach is likely to result in a high risk to the rights and freedoms of natural persons, the controller shall communicate the personal data breach to the data subject without undue delay"
    applies_when:
      flags: [eu_data_subjects]
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679
    citation: "Regulation (EU) 2016/679, Article 34(1)"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "Opened in the desktop browser pane on 2026-11-03. No hour count in the text. Article 34(3) lists the exceptions (encryption rendering the data unintelligible, subsequent measures, or disproportionate effort with a public communication instead); Article 34(4) lets the supervisory authority require the communication."

