  - id: sec_8k_item_105_material_incident
    name: SEC Form 8-K Item 1.05, disclosure of a material cybersecurity incident
    regulator: US Securities and Exchange Commission
    jurisdiction: US-federal
    trigger: the registrant determines that it has experienced a material cybersecurity incident
    deadline_hours: null
    deadline_business_days: 4
    deadline_text: "A report pursuant to Item 1.05 is to be filed within four business days after the registrant determines that it has experienced a material cybersecurity incident"
    applies_when:
      public_company: true
      countries: [US]
    source_url: https://www.sec.gov/files/form8-k.pdf
    citation: "Form 8-K, General Instruction B.1 and Item 1.05(a), with Instruction 1 to Item 1.05"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "PDF opened and text extracted on 2026-11-03 (pages 3 and 11 to 12 of 40). The clock runs from the materiality determination, and Instruction 1 requires that determination to be made without unreasonable delay after discovery, so the exercise should test who makes it and when. Item 1.05(c) allows a delay of up to 30 days (extendable) if the US Attorney General determines in writing that disclosure poses a substantial risk to national security or public safety. Information not yet determined at filing must be added by amendment within four business days after it becomes available (Instruction 2). Foreign private issuers report on Form 6-K and are not covered by this clock."

  - id: circia_covered_incident_72h
    name: CIRCIA, report of a covered cyber incident to CISA (final rule not yet effective)
    regulator: CISA
    jurisdiction: US-federal
    trigger: the covered entity reasonably believes that a covered cyber incident has occurred
    deadline_hours: 72
    deadline_business_days: null
    deadline_text: "A covered entity that experiences a covered cyber incident shall report the covered cyber incident to the Agency not later than 72 hours after the covered entity reasonably believes that the covered cyber incident has occurred"
    applies_when:
      countries: [US]
      flags: [critical_infrastructure]
    source_url: https://www.cisa.gov/topics/cyber-threats-and-advisories/information-sharing/cyber-incident-reporting-critical-infrastructure-act-2022-circia
    citation: "6 U.S.C. 681b(a)(1)(A); CISA CIRCIA program page; proposed rule published April 4, 2024"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "CISA page opened on 2026-11-03 and statute text confirmed at https://www.law.cornell.edu/uscode/text/6/681b. Status as of 2026-11-03: the final rule is not yet effective. The CISA page says the NPRM was published April 4, 2024, that CISA held four town hall meetings between June 15 and June 18, 2026, that funding lapses affected the rulemaking, that 'CISA continues to work on the final rule', and that 'Until the effective date of the final rule, organizations are not required to submit covered cyber incident or ransom payment reports under CIRCIA'. The clock is included so exercises rehearse it; the final rule may change the definitions of covered entity and covered cyber incident and the reporting form. The exercise should treat it as expected practice, not a live obligation, until the rule is effective."

