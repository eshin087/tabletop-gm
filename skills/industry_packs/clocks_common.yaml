  - id: pci_visa_compromise_notice_3_days
    name: Visa What To Do If Compromised, notification of a suspected or confirmed Compromise Event to Visa
    regulator: Visa Global Risk Investigations (card brand rules, enforced through the acquiring bank)
    jurisdiction: Global (Visa payment system participants)
    trigger: discovery of evidence sufficient to raise a reasonable suspicion of, or to confirm, a Compromise Event involving Visa payment account data or a system that stores, processes, or transmits it
    deadline_hours: 72
    deadline_business_days: null
    deadline_text: "An entity that suspects or confirms unauthorized access to any Visa payment account data, or to any payment system that stores, processes, or transmits Visa payment account data, is required to ensure that the Compromise Event is reported to Visa's Global Risk Investigations group within three (3) calendar days of either: a. The discovery of evidence sufficient to raise a reasonable suspicion of a Compromise Event, or b. The discovery of evidence sufficient to confirm the existence of a Compromise Event"
    applies_when:
      data_types: [PCI]
      flags: [pci_merchant]
    source_url: https://usa.visa.com/dam/VCOM/download/merchants/cisp-what-to-do-if-compromised.pdf
    citation: "Visa, What To Do If Compromised, Visa Supplemental Requirements, Version 10.0, effective 25 June 2026, Section A-1.1"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "PDF opened and text extracted on 2026-11-03. Follow-on deadlines in the same document: an Incident Report to Visa and the acquiring bank within three calendar days of notifying Visa (A-2.1); at-risk account numbers to Visa within three calendar days of discovery, a Visa request, or determination of the window of exposure (A-4.1); if Visa requires a PCI Forensic Investigator, a signed PFI contract within five business days, a preliminary report within five business days of retaining the PFI, and a final report within ten business days of completing the investigation (A-5.1). Section A-3.1 says to immediately notify the issuing or acquiring bank. Mastercard's account data compromise rules were not fetched; add them before using this clock for a Mastercard-only dispute. State breach laws apply in parallel when card data counts as personal information."

