  - id: state_fl_individual_notice
    name: Florida, notice of a breach of security to individuals
    regulator: Florida Department of Legal Affairs (Attorney General)
    jurisdiction: US-FL
    trigger: determination of a breach or reason to believe a breach occurred involving personal information of Florida individuals
    deadline_hours: 720
    deadline_business_days: null
    deadline_text: "Notice to individuals shall be made as expeditiously as practicable and without unreasonable delay, taking into account the time necessary to allow the covered entity to determine the scope of the breach of security, to identify individuals affected by the breach, and to restore the reasonable integrity of the data system that was breached, but no later than 30 days after the determination of a breach or reason to believe a breach occurred"
    applies_when:
      countries: [US]
      states: [FL]
      data_types: [PII]
    source_url: http://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0501/Sections/0501.171.html
    citation: "Fla. Stat. 501.171(4)(a)"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
    notes: "Statute page opened on 2026-11-03. Notice may be delayed at the written request of a law enforcement agency (501.171(4)(b)). Notice is not required if, after investigation and consultation with law enforcement, the entity reasonably determines the breach has not and will not likely result in identity theft or financial harm, and documents that determination in writing within 30 days and provides it to the department (501.171(4)(c))."

