      states: [CA]
      data_types: [PII]
    source_url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.82
    citation: "Cal. Civ. Code 1798.82(a)(2)(A)"
    tier: researched
    verified_date: 2026-11-03
    verifier: "pack_research skill (Claude), not yet human-checked"
